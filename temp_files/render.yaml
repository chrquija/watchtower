services:
  - type: web
    name: watchtower
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: watchtower-data
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
